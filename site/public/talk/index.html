document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius:  line-height: 1.14; margin: 0 0 46px; }\n.display { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-display); line-height: 1.05; margin: 0; }\n.lede { font-size: var(--type-subtitle); line-height: 1.4; margin: 0; max-width: 30ch; }\n.meta { font-size: var(--type-kicker); color: color-mix(in srgb, var(--color-text) 55%, transparent); letter-spacing: 0.06em; }\n.caption { margin-top: auto; font-size: var(--type-small); color: var(--color-accent-700); max-width: 62ch; }\n\n.cover { justify-content: center; align-items: center; text-align: center; gap: 40px; background: var(--color-surface); }\n.divider { justify-content: center; align-items: center; text-align: center; background: var(--color-accent-2-800); color: var(--color-bg); overflow: hidden; gap: 30px; }\n.divider::before { content: \"\"; position: absolute; right: -300px; bottom: -400px; width: 1000px; height: 1000px; border-radius: 999px; background: var(--color-accent-2-700); }\n.divider > * { position: relative; }\n.divider .slide-title { margin: 0; }\n.divider .lede { max-width: 26ch; color: var(--color-accent-2-200); }\n\n/* — tier diagram — */\n.diagram { display: grid; grid-template-columns: 1fr 400px; gap: 40px; align-items: stretch; }\n.tiers { display: flex; flex-direction: column; }\n.tier { display: grid; grid-template-columns: 168px 1fr; gap: 26px; align-items: center;\n  background: var(--color-surface); border-radius: var(--radius-lg); padding: 20px 28px; }\n.tier-label { font-family: var(--font-heading); font-size: var(--type-small); color: var(--color-accent-700); line-height: 1.1; }\n.tier-body { display: flex; flex-direction: column; gap: 14px; }\n.boxes { display: flex; flex-wrap: wrap; gap: 14px; }\n.box { background: var(--color-bg); border-radius: var(--radius-md); padding: 12px 20px; font-size: var(--type-small); }\n.box.hot { background: var(--color-accent-200); color: var(--color-accent-900); }\n.roles { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }\n.roles-label { font-size: var(--type-kicker); color: var(--color-accent-700); letter-spacing: 0.04em; }\n.role { border: 1px solid var(--color-accent-400); color: var(--color-accent-800); border-radius: 999px; padding: 6px 18px; font-size: var(--type-kicker); }\n.between { height: 30px; display: flex; align-items: center; justify-content: center; gap: 12px; }\n.between i { display: block; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; }\n.between i.up { border-bottom: 13px solid var(--color-accent-400); }\n.between i.dn { border-top: 13px solid var(--color-accent-400); }\n.thirdparty { border: 3px dashed var(--color-accent-400); border-radius: var(--radius-lg); padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }\n.thirdparty h3 { font-family: var(--font-heading); font-size: var(--type-small); margin: 0 0 4px; color: var(--color-accent-700); }\n.tp { background: var(--color-accent-100); border-radius: var(--radius-md); padding: 10px 18px; font-size: var(--type-kicker); }\n\n/* — four-up mini stacks — */\n.fourup { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 34px; }\n.mini { background: var(--color-surface); border-radius: var(--radius-lg); padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; }\n.mini h3 { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-small); margin: 0 0 6px; }\n.band { display: flex; align-items: baseline; gap: 16px; line-height: 1.3; background: var(--color-bg); border-radius: 999px; padding: 8px 20px; font-size: var(--type-kicker); }\n.band b { font-family: var(--font-heading); font-weight: 400; color: var(--color-accent-700); flex: 0 0 124px; }\n.band span { flex: 1; }\n.band.hot { background: var(--color-accent-200); }\n\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }\n.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }\n.card { background: var(--color-surface); border-radius: var(--radius-lg); padding: 32px 34px; font-size: var(--type-body); line-height: 1.35; }\n.card-kicker { font-family: var(--font-heading); font-size: var(--type-kicker); color: var(--color-accent-700); letter-spacing: 0.04em; margin: 0 0 14px; }\n\n.bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 34px; font-size: var(--type-body); line-height: 1.4; max-width: 30ch; }\n.bullets li { display: flex; gap: 22px; }\n.dot { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 999px; background: var(--color-accent); margin-top: 16px; }\n\n.docmock { background: var(--color-neutral-100); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 34px 38px; display: flex; flex-direction: column; gap: 18px; }\n.docmock .rule { height: 12px; border-radius: 999px; background: var(--color-neutral-300); }\n.docmock .rule.short { width: 55%; }\n.doc-head { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-subtitle); line-height: 1.1; margin: 0; }\n.doc-sub { font-size: var(--type-kicker); color: var(--color-neutral-600); margin: 0; letter-spacing: 0.04em; }\n.sigline { display: flex; align-items: center; gap: 16px; font-size: var(--type-kicker); color: var(--color-accent-2-700); border-top: 1px solid var(--color-divider); padding-top: 18px; }\n.seal { width: 46px; height: 46px; border-radius: 999px; background: var(--color-accent-2-300); flex: 0 0 auto; }\n\n.numgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 26px; }\n.numcard { background: var(--color-surface); border-radius: var(--radius-lg); padding: 30px 26px; display: flex; flex-direction: column; gap: 18px; }\n.numcard .n { width: 62px; height: 62px; border-radius: 999px; background: var(--color-accent); color: var(--color-bg); font-family: var(--font-heading); font-size: var(--type-small); display: flex; align-items: center; justify-content: center; }\n.numcard h3 { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-small); margin: 0; line-height: 1.15; }\n.numcard p { font-size: var(--type-kicker); line-height: 1.4; margin: 0; color: color-mix(in srgb, var(--color-text) 78%, transparent); }\n\n.flowrow { display: flex; align-items: stretch; gap: 22px; }\n.step { flex: 1; background: var(--color-surface); border-radius: var(--radius-lg); padding: 30px 28px; display: flex; flex-direction: column; gap: 16px; }\n.step .n { font-family: var(--font-heading); font-size: var(--type-kicker); color: var(--color-accent); letter-spacing: 0.04em; }\n.step h3 { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-small); margin: 0; line-height: 1.2; }\n.step p { margin: 0; font-size: var(--type-kicker); line-height: 1.4; }\n.chev { flex: 0 0 auto; align-self: center; width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 22px solid var(--color-accent-400); }\n\n.seq { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 18px; }\n.lanes { position: absolute; inset: 74px 0 0 0; display: grid; grid-template-columns: repeat(3, 1fr); pointer-events: none; }\n.lanes span { justify-self: center; width: 3px; height: 100%; background: repeating-linear-gradient(to bottom, var(--color-neutral-400) 0 10px, transparent 10px 20px); }\n.lane-head { grid-row: 1; font-family: var(--font-heading); font-size: var(--type-small); text-align: center; padding-bottom: 22px; }\n.msg { position: relative; z-index: 1; background: var(--color-bg); border: 2px solid var(--color-accent-300); border-radius: 999px; padding: 12px 30px; font-size: var(--type-kicker); text-align: center; }\n.msg.sign { background: var(--color-accent-2-100); border-color: var(--color-accent-2-400); }\n.msg::after { content: \"\"; position: absolute; top: 50%; right: -16px; transform: translateY(-50%); border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 16px solid var(--color-accent-400); }\n.msg.rev::after { right: auto; left: -16px; border-left: 0; border-right: 16px solid var(--color-accent-400); }\n\n.table { width: 100%; border-collapse: collapse; font-size: var(--type-small); }\n.table th, .table td { text-align: left; padding: 20px 24px; border-bottom: 1px solid var(--color-divider); vertical-align: top; }\n.table thead th { font-family: var(--font-heading); font-weight: 400; font-size: var(--type-small); color: var(--color-accent-700); }\n.table tbody th { font-family: var(--font-body); font-size: var(--type-small); font-weight: 500; text-transform: none; letter-spacing: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent); width: 26%; }\n.table thead th { text-transform: none; letter-spacing: 0; }\n\n.quote { justify-content: center; background: var(--color-accent-2-800); color: var(--color-bg); text-align: center; align-items: center; gap: 44px; }\n.quote blockquote { font-family: var(--font-heading); font-weight: 400; font-size: 68px; line-height: 1.2; margin: 0; max-width: 22ch; }\n.repo { font-family: var(--font-heading); font-size: var(--type-subtitle); background: var(--color-accent); color: var(--color-bg); border-radius: 999px; padding: 20px 48px; display: inline-block; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"189894ba-a094-4f17-8694-629016ad0fca#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Cover\" data-screen-label=\"01\" class=\"slide cover\" data-speaker-notes=\"Eight minutes. Say the name, say the claim, move. The argument is civic, not technical.\">\n  <p class=\"meta\">A PEER-TO-PEER ALTERNATIVE TO THE THREE-TIER STACK<\u002Fp>\n  <h1 class=\"display\">Souspli<\u002Fh1>\n  <p class=\"lede\">Services built out of signed documents that people exchange and keep, instead of pages a server renders for them.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Anatomy of three tiers\" data-screen-label=\"02\" class=\"slide\" data-speaker-notes=\"Forty seconds. This is the shape of nearly everything on the web. Point at the permission box and the dashed column.\">\n  <h2 class=\"slide-title\">Anatomy of a three-tier service<\u002Fh2>\n  <div class=\"diagram\">\n    <div class=\"tiers\">\n      <div class=\"tier\">\n        <div class=\"tier-label\">Clients<\u002Fdiv>\n        <div class=\"tier-body\"><div class=\"boxes\"><span class=\"box\">Web frontend<\u002Fspan><span class=\"box\">iOS app<\u002Fspan><span class=\"box\">Android app<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"between\"><i class=\"up\"><\u002Fi><i class=\"dn\"><\u002Fi><\u002Fdiv>\n      <div class=\"tier\">\n        <div class=\"tier-label\">Edge<\u002Fdiv>\n        <div class=\"tier-body\"><div class=\"boxes\"><span class=\"box\">CDN cache<\u002Fspan><span class=\"box\">Web server<\u002Fspan><span class=\"box\">Per-request render<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"between\"><i class=\"up\"><\u002Fi><i class=\"dn\"><\u002Fi><\u002Fdiv>\n      <div class=\"tier\">\n        <div class=\"tier-label\">Application<\u002Fdiv>\n        <div class=\"tier-body\">\n          <div class=\"boxes\"><span class=\"box\">REST API<\u002Fspan><span class=\"box\">WebSocket gateway<\u002Fspan><span class=\"box hot\">Permission checks<\u002Fspan><span class=\"box\">Background queues<\u002Fspan><\u002Fdiv>\n          <div class=\"roles\"><span class=\"roles-label\">ROLES DECIDED HERE<\u002Fspan><span class=\"role\">Anonymous<\u002Fspan><span class=\"role\">Customer<\u002Fspan><span class=\"role\">Staff<\u002Fspan><span class=\"role\">Auditor<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"between\"><i class=\"up\"><\u002Fi><i class=\"dn\"><\u002Fi><\u002Fdiv>\n      <div class=\"tier\">\n        <div class=\"tier-label\">Data<\u002Fdiv>\n        <div class=\"tier-body\"><div class=\"boxes\"><span class=\"box\">Primary database<\u002Fspan><span class=\"box\">Cache<\u002Fspan><span class=\"box\">Object store<\u002Fspan><span class=\"box\">Warehouse<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"thirdparty\">\n      <h3>Third parties<\u002Fh3>\n      <span class=\"tp\">Payments<\u002Fspan>\n      <span class=\"tp\">Email and SMS<\u002Fspan>\n      <span class=\"tp\">Analytics<\u002Fspan>\n      <span class=\"tp\">Advertising<\u002Fspan>\n      <span class=\"tp\">Reached from the servers <em>and<\u002Fem> from the user's own device<\u002Fspan>\n    <\u002Faside>\n  <\u002Fdiv>\n  <p class=\"caption\">Every byte the user sees is assembled by the operator, per request.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Four services, one shape\" data-screen-label=\"03\" class=\"slide\" data-speaker-notes=\"Thirty seconds, no dwelling. The point is that four unrelated industries produce the same diagram.\">\n  <h2 class=\"slide-title\">Four services, one shape<\u002Fh2>\n  <div class=\"fourup\">\n    <div class=\"mini\">\n      <h3>Social network<\u002Fh3>\n      <div class=\"band\"><b>Clients<\u002Fb><span>Web feed, iOS, Android<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Edge<\u002Fb><span>Media CDN, web server<\u002Fspan><\u002Fdiv>\n      <div class=\"band hot\"><b>Application<\u002Fb><span>Ranking, messaging, visibility rules<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Data<\u002Fb><span>Social graph, posts, ad inventory<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Roles<\u002Fb><span>Member · Advertiser · Moderator · Police liaison<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mini\">\n      <h3>Ride-hailing and delivery<\u002Fh3>\n      <div class=\"band\"><b>Clients<\u002Fb><span>Rider app, driver app, merchant tablet<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Edge<\u002Fb><span>CDN, web server<\u002Fspan><\u002Fdiv>\n      <div class=\"band hot\"><b>Application<\u002Fb><span>Dispatch, location, pricing rules<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Data<\u002Fb><span>Trips, routes, payments, telemetry<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Roles<\u002Fb><span>Rider · Driver · Fleet · Support · Regulator<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mini\">\n      <h3>Event organising<\u002Fh3>\n      <div class=\"band\"><b>Clients<\u002Fb><span>Event page, mobile app, door check-in<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Edge<\u002Fb><span>CDN, web server<\u002Fspan><\u002Fdiv>\n      <div class=\"band hot\"><b>Application<\u002Fb><span>RSVP API, guest-list rules, reminders<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Data<\u002Fb><span>Groups, events, RSVPs, ticket orders<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Roles<\u002Fb><span>Attendee · Host · Co-organiser · Venue<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mini\">\n      <h3>News publishing<\u002Fh3>\n      <div class=\"band\"><b>Clients<\u002Fb><span>Web article, iOS, Android<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Edge<\u002Fb><span>Regional cache, per-request render<\u002Fspan><\u002Fdiv>\n      <div class=\"band hot\"><b>Application<\u002Fb><span>Article API, paywall, personalisation<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Data<\u002Fb><span>Articles, subscribers, reader events<\u002Fspan><\u002Fdiv>\n      <div class=\"band\"><b>Roles<\u002Fb><span>Reader · Subscriber · Journalist · Editor<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"One URL, many pages\" data-screen-label=\"04\" class=\"slide\" data-speaker-notes=\"The heart of the diagnosis. Same address, same second, different artefacts — and nobody can tell.\">\n  <h2 class=\"slide-title\">One URL, many pages<\u002Fh2>\n  <div style=\"display: flex; flex-direction: column; gap: 30px;\">\n    <div style=\"align-self: center; background: var(--color-accent-200); color: var(--color-accent-900); border-radius: 999px; padding: 16px 44px; font-size: var(--type-small);\">example-news.com/2026/05/14/report<\u002Fdiv>\n    <div class=\"between\"><i class=\"dn\"><\u002Fi><i class=\"dn\"><\u002Fi><i class=\"dn\"><\u002Fi><\u002Fdiv>\n    <div class=\"grid3\">\n      <div class=\"card\">\n        <p class=\"card-kicker\">READER A · SUBSCRIBER<\u002Fp>\n        <p>Full text, no advertising, a recirculation module built from her last forty articles.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <p class=\"card-kicker\">READER B · METERED<\u002Fp>\n        <p>Four paragraphs, then an offer priced by his country and his visit count.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <p class=\"card-kicker\">READER C · ONE HOUR LATER<\u002Fp>\n        <p>A revised headline, a corrected figure, different advertising. No notice that anything moved.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"caption\">There is no artefact to keep, to compare, or to disagree with — only a rendering, and it is gone when the tab closes.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Custody\" data-screen-label=\"05\" class=\"slide\" data-speaker-notes=\"Twenty seconds. Three sentences and turn the corner.\">\n  <h2 class=\"slide-title\">What the four have in common<\u002Fh2>\n  <div class=\"grid3\">\n    <div class=\"card\">\n      <p class=\"card-kicker\">CUSTODY<\u002Fp>\n      <p>The database is the system of record. The user holds a session, not a copy.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <p class=\"card-kicker\">RULES<\u002Fp>\n      <p>Who may see what is decided in the application tier, and can change overnight.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <p class=\"card-kicker\">REACH<\u002Fp>\n      <p>The client is a collection point too, opening connections to parties the user never chose.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Divider\" data-screen-label=\"06\" class=\"slide divider\" data-speaker-notes=\"Turn. The rest is the proposal.\">\n  <h2 class=\"slide-title\"><em>Sous pli</em>: under cover<\u002Fh2>\n  <p class=\"lede\">Everything that follows is one letter, exchanged between peers.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Anatomy of a letter\" data-screen-label=\"07\" class=\"slide\" data-speaker-notes=\"Walk the four annotations against the mock. This is the whole technical proposal.\">\n  <h2 class=\"slide-title\">Anatomy of a letter<\u002Fh2>\n  <div style=\"display: grid; grid-template-columns: 700px 1fr; gap: 80px; align-items: start;\">\n    <div class=\"docmock\">\n      <p class=\"doc-sub\">THE RIVERSIDE LEDGER · 14 MAY 2026<\u002Fp>\n      <h3 class=\"doc-head\">Flood defences approved after eight-year delay<\u002Fh3>\n      <div class=\"rule\"><\u002Fdiv>\n      <div class=\"rule\"><\u002Fdiv>\n      <div class=\"rule short\"><\u002Fdiv>\n      <div class=\"rule\"><\u002Fdiv>\n      <div class=\"rule short\"><\u002Fdiv>\n      <div class=\"sigline\">\n        <span class=\"seal\"><\u002Fspan>\n        <span>Signed by The Riverside Ledger · sha256 4f9c…21ab<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"bullets\">\n      <li><span class=\"dot\"><\u002Fspan><span>One file of HTML. Text, images, styling and behaviour, all inside it.<\u002Fspan><\u002Fli>\n      <li><span class=\"dot\"><\u002Fspan><span>Readable as source by a person, and openable by any browser for as long as browsers exist.<\u002Fspan><\u002Fli>\n      <li><span class=\"dot\"><\u002Fspan><span>Signed by its author. The hash is the identity, so any edit makes a different document.<\u002Fspan><\u002Fli>\n      <li><span class=\"dot\"><\u002Fspan><span>Run in a sealed container: rich and interactive, with no way out to the network.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Five guarantees\" data-screen-label=\"08\" class=\"slide\" data-speaker-notes=\"Read the five headings only. If any one of them fails, the model collapses back into the web.\">\n  <h2 class=\"slide-title\">Five guarantees<\u002Fh2>\n  <div class=\"numgrid\">\n    <div class=\"numcard\">\n      <span class=\"n\">1<\u002Fspan>\n      <h3>Self-contained<\u002Fh3>\n      <p>No external fetches. What you received is the whole of it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"numcard\">\n      <span class=\"n\">2<\u002Fspan>\n      <h3>Human-readable<\u002Fh3>\n      <p>Open technologies, plain markup, no build artefact to decode.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"numcard\">\n      <span class=\"n\">3<\u002Fspan>\n      <h3>Immutable<\u002Fh3>\n      <p>Identified by content. A correction is a new letter, not a silent edit.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"numcard\">\n      <span class=\"n\">4<\u002Fspan>\n      <h3>Attributable<\u002Fh3>\n      <p>Signed by the sender, so provenance travels with the file.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"numcard\">\n      <span class=\"n\">5<\u002Fspan>\n      <h3>Sealed<\u002Fh3>\n      <p>Interactive, but with no exit. It cannot report on its reader.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"caption\">Archiving is then a copy operation, and the copy is a complete one.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"The newspaper\" data-screen-label=\"09\" class=\"slide\" data-speaker-notes=\"The physical-newspaper analogy. Same edition for everyone, yours to keep, yours to hand on.\">\n  <h2 class=\"slide-title\">The newspaper<\u002Fh2>\n  <div class=\"flowrow\">\n    <div class=\"step\">\n      <span class=\"n\">01<\u002Fspan>\n      <h3>The publisher composes<\u002Fh3>\n      <p>The edition is written as one self-contained file, advertising included.<\u002Fp>\n    <\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\">\n      <span class=\"n\">02<\u002Fspan>\n      <h3>The publisher signs<\u002Fh3>\n      <p>A signature and a content hash fix the edition. Nothing in it can move afterwards.<\u002Fp>\n    <\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\">\n      <span class=\"n\">03<\u002Fspan>\n      <h3>A reader fetches it<\u002Fh3>\n      <p>From the publisher, or from anyone who already has it. The bytes are identical.<\u002Fp>\n    <\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\">\n      <span class=\"n\">04<\u002Fspan>\n      <h3>The reader keeps it<\u002Fh3>\n      <p>Read it now or in a decade, shelve it, or hand it to a friend.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"caption\">The advertisement inside is the one everyone else received — which is what an advertisement used to be.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"CV and contract\" data-screen-label=\"10\" class=\"slide\" data-speaker-notes=\"A LinkedIn profile is a CV that somebody else keeps. Here it is a document you send.\">\n  <h2 class=\"slide-title\">The CV and the contract<\u002Fh2>\n  <div class=\"seq\">\n    <div class=\"lanes\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <div class=\"lane-head\" style=\"grid-column: 1 / 3;\">Job seeker<\u002Fdiv>\n    <div class=\"lane-head\" style=\"grid-column: 3 / 5;\">Recruiter<\u002Fdiv>\n    <div class=\"lane-head\" style=\"grid-column: 5 / 7;\">Hiring manager<\u002Fdiv>\n    <div class=\"msg sign\" style=\"grid-column: 2 / 4;\">Curriculum vitae, signed<\u002Fdiv>\n    <div class=\"msg rev\" style=\"grid-column: 2 / 4;\">Letter: nothing suitable at present<\u002Fdiv>\n    <div class=\"msg sign\" style=\"grid-column: 2 / 4;\">The same CV, to a second recruiter<\u002Fdiv>\n    <div class=\"msg sign rev\" style=\"grid-column: 2 / 4;\">Representation agreement, signed<\u002Fdiv>\n    <div class=\"msg sign\" style=\"grid-column: 2 / 4;\">Agreement countersigned<\u002Fdiv>\n    <div class=\"msg\" style=\"grid-column: 4 / 6;\">Curriculum vitae, forwarded<\u002Fdiv>\n    <div class=\"msg rev\" style=\"grid-column: 4 / 6;\">Letter: request for an interview<\u002Fdiv>\n    <div class=\"msg rev\" style=\"grid-column: 2 / 4;\">Interview arrangements<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"caption\">Eight documents, three parties, no platform. Each party keeps the copies it was sent.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Commercial paper\" data-screen-label=\"11\" class=\"slide\" data-speaker-notes=\"Answer the structure objection here: the schema rides inside the letter, so agents check it locally and reply with a memorandum.\">\n  <h2 class=\"slide-title\">Commercial paper<\u002Fh2>\n  <div class=\"flowrow\">\n    <div class=\"step\"><span class=\"n\">BUYER<\u002Fspan><h3>Purchase order<\u002Fh3><p>Line items, SKUs, delivery terms. Signed.<\u002Fp><\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\"><span class=\"n\">VENDOR<\u002Fspan><h3>Order acknowledgement<\u002Fh3><p>Accepted lines, dates, substitutions.<\u002Fp><\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\"><span class=\"n\">CARRIER<\u002Fspan><h3>Delivery status report<\u002Fh3><p>Consignment, handover, exceptions.<\u002Fp><\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\"><span class=\"n\">VENDOR<\u002Fspan><h3>Invoice<\u002Fh3><p>References the order it settles.<\u002Fp><\u002Fdiv>\n    <span class=\"chev\"><\u002Fspan>\n    <div class=\"step\"><span class=\"n\">BUYER<\u002Fspan><h3>Receipt<\u002Fh3><p>Closes the chain. Every party holds the whole file.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"caption\">The schema rides inside the letter, so a vendor's agent can reject a withdrawn SKU on its own machine and reply with a memorandum — itself a letter.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Comparison\" data-screen-label=\"12\" class=\"slide\" data-speaker-notes=\"The summary slide. Read down the right-hand column and stop.\">\n  <h2 class=\"slide-title\">Two models side by side<\u002Fh2>\n  <sc-raw-table class=\"table\">\n    <sc-raw-thead>\n      <sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th>Three-tier service<\u002Fsc-raw-th><sc-raw-th>Souspli<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-th>System of record<\u002Fsc-raw-th><sc-raw-td>The operator's database<\u002Fsc-raw-td><sc-raw-td>The copy in each party's hands<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-th>What the user receives<\u002Fsc-raw-th><sc-raw-td>A rendering, valid for one session<\u002Fsc-raw-td><sc-raw-td>A file, valid indefinitely<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-th>Who sets the rules<\u002Fsc-raw-th><sc-raw-td>The application tier, changeable at will<\u002Fsc-raw-td><sc-raw-td>The terms written into the document<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-th>Same content for everyone<\u002Fsc-raw-th><sc-raw-td>No, and not verifiably so<\u002Fsc-raw-td><sc-raw-td>Yes, by content hash<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-th>Archiving<\u002Fsc-raw-th><sc-raw-td>Screenshots and scrapers<\u002Fsc-raw-td><sc-raw-td>Copy the file<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-th>Leakage from the client<\u002Fsc-raw-th><sc-raw-td>Dozens of third-party connections<\u002Fsc-raw-td><sc-raw-td>None; the container has no exit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section data-label=\"Quote\" data-screen-label=\"13\" class=\"slide quote\" data-speaker-notes=\"Slow right down. This is the argument; the architecture was only the evidence.\">\n  <blockquote>The exchange of documents between free people is how we operated for centuries.<\u002Fblockquote>\n  <p class=\"meta\" style=\"color: var(--color-accent-2-300);\">AND WE HAVE MORE THAN ENOUGH BANDWIDTH TO GO ON DOING IT<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Close\" data-screen-label=\"14\" class=\"slide cover\" data-speaker-notes=\"The ask: go and run it. Say the URL out loud once, then leave the slide up.\">\n  <p class=\"meta\">THERE IS A WORKING PROOF OF CONCEPT<\u002Fp>\n  <h2 class=\"display\" style=\"font-size: 84px;\">Download it and<br>open a letter<\u002Fh2>\n  <span class=\"repo\">souspli.org<\u002Fspan>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
